<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Our New Home — Raihan & Kara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF7F0;
    --bg-card: #F2ECDF;
    --ink: #2B241C;
    --ink-soft: #6B6053;
    --sage: #5F6E52;
    --sage-deep: #47533D;
    --brass: #A9803F;
    --line: #E1D8C4;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E1C17;
      --bg-card: #28241D;
      --ink: #EFE9DC;
      --ink-soft: #B7AD9B;
      --sage: #9CB088;
      --sage-deep: #B7C7A3;
      --brass: #D4AE72;
      --line: #3A342A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E1C17;
    --bg-card: #28241D;
    --ink: #EFE9DC;
    --ink-soft: #B7AD9B;
    --sage: #9CB088;
    --sage-deep: #B7C7A3;
    --brass: #D4AE72;
    --line: #3A342A;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  header {
    text-align: left;
    margin-bottom: 48px;
  }
  .kicker {
    font-size: 14px;
    color: var(--sage-deep);
    letter-spacing: 0.02em;
    margin: 0 0 14px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(34px, 7vw, 46px);
    line-height: 1.12;
    margin: 0 0 16px;
    color: var(--ink);
  }
  header p {
    max-width: 46ch;
    color: var(--ink-soft);
    font-size: 16px;
    margin: 0;
  }
  .divider {
    height: 1px;
    background: var(--line);
    margin: 40px 0 32px;
    border: none;
  }
  section { margin-bottom: 40px; }
  .section-label {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 20px;
    color: var(--sage);
    margin: 0 0 18px;
  }
  .item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item-name {
    font-size: 17px;
    color: var(--ink);
    font-weight: 500;
  }
  .item a.buy {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--brass);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s ease;
    white-space: nowrap;
  }
  .item a.buy:hover, .item a.buy:focus-visible {
    border-bottom-color: var(--brass);
  }
  .item a.buy:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 3px;
  }
  .item .claimed-tag {
    flex-shrink: 0;
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
    white-space: nowrap;
  }
  .item.is-claimed .item-name {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--line);
  }
  .item.is-gifted {
    opacity: 0.5;
  }
  .item.is-gifted .item-name {
    text-decoration: line-through;
    text-decoration-color: var(--line);
  }
  footer {
    margin-top: 56px;
    padding-top: 28px;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 14px;
  }
  footer .names {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    color: var(--sage-deep);
    margin-bottom: 6px;
  }
  .shipping {
    margin-top: 56px;
    padding: 24px 22px;
    background: var(--bg-card);
    border-radius: 4px;
  }
  .shipping-label {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--sage);
    margin: 0 0 12px;
  }
  .shipping address {
    font-style: normal;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
  }
  .shipping address p { margin: 0 0 4px; }
  .note {
    margin-top: 24px;
    color: var(--ink-soft);
    font-size: 14px;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="wrap">
